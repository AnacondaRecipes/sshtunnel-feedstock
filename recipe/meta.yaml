{% set name = "sshtunnel" %}
{% set version = "0.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b7628901e34a297a1a754d136e5e1262cfdef1c3e0a19f75474457ffb49d6838

build:
  entry_points:
    - sshtunnel = sshtunnel:_cli_main
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools
    - paramiko >=1.15.2
    - wheel
  run:
    - paramiko >=2.7.2
    - python

test:
  imports:
    - sshtunnel
  requires:
    - python
  commands:
    - pip check

about:
  home: https://github.com/pahaz/sshtunnel
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Pure Python SSH tunnels
  doc_url: https://github.com/pahaz/sshtunnel
  dev_url: https://github.com/pahaz/sshtunnel

extra:
  recipe-maintainers:
    - basnijholt
    - pahaz
    - fernandezcuesta
    - BrentDorsey
